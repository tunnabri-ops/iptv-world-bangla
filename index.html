<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV World Bangla — বিশ্ব সংবাদ</title><style>body{font-family:system-ui;margin:0;background:#0b1220;color:#fff}main{max-width:720px;margin:0 auto;padding:20px}video{width:100%;background:#000;border-radius:12px}input{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box}button{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;cursor:pointer}button.active{background:#0284c7}</style></head><body><main><h1>🌍 IPTV World Bangla</h1><p>বিশ্ব সংবাদ চ্যানেল — একক চ্যানেল বেছে Play চাপুন। তালিকা: <a href="playlist_world.m3u8" style="color:#7dd3fc">playlist_world.m3u8</a></p><input id="q" placeholder="চ্যানেল খুঁজুন… (যেমন: Al Jazeera, NDTV)" oninput="render()"><video id="v" controls playsinline></video><p id="now"></p><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script><script>const channels=[["Al Jazeera English","https://live-hls-apps-aje-fa.getaj.net/AJE/index.m3u8"],["DW English","https://amg01644-amg01644c1-amgplt0343.playout.now3.amagi.tv/ts-eu-w1-n2/playlist/amg01644-amg01644c1-amgplt0343/playlist.m3u8"],["Euronews English","https://jmp2.uk/plu-61de96114757070008d33cae.m3u8"],["Sky News Arabia","https://live-stream.skynewsarabia.com/c-horizontal-channel/horizontal-stream/index.m3u8"],["NDTV 24x7","https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/in/YuppTV/NDTV24x7.m3u8"],["Al Arabiya English","https://live.alarabiya.net/alarabiapublish/english/playlist_dvr.m3u8"],["TRT World","https://mumbai-edge.smartplaytv.in/TRTWorld/index.m3u8"],["WION","http://vg-zeefta.akamaized.net/ptnr-yupptv/title-wion/v1/master/611d79b11b77e2f571934fd80ca1413453772ac7/20c3c0d9-0256-43fe-bca6-70fdd490b957/main.m3u8"],["NHK World-Japan","https://cdn.pishow.tv/ott/live/455/master.m3u8"],["CNBC UK","https://amg01079-nbcuuk-amg01079c2-samsung-gb-1258.playouts.now.amagi.tv/playlist.m3u8"]];let hls=null;function render(){const q=(document.getElementById('q').value||'').toLowerCase();const list=document.getElementById('list');list.innerHTML='';channels.filter(c=>c[0].toLowerCase().includes(q)).forEach(c=>{const b=document.createElement('button');b.textContent='▶ '+c[0];b.onclick=()=>play(c);list.appendChild(b);});}function play(c){const v=document.getElementById('v');document.getElementById('now').textContent='চলছে: '+c[0];document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('active',b.textContent.includes(c[0])));if(hls){hls.destroy();hls=null;}if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=c[1];v.play();}else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(c[1]);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play());hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)document.getElementById('now').textContent='চালানো যায়নি: '+c[0]+' — লিংকটি যাচাই করুন।';});}else{document.getElementById('now').textContent='এই ব্রাউজারে HLS চলে না — VLC-তে playlist_world.m3u8 খুলুন।';}}render();</script></body></html>
